[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mempro"
version = "0.1.0"
description = "Membrane Protein Orientation in Lipid Bilayers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cpu]==0.6.0",
    "matplotlib>=3.8.4",
]

[project.scripts]
mempro = "mempro._cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mempro*"]

[tool.setuptools.package-data]
mempro = ["Insane4MemPrO.py", "martini_v3.itp"]
